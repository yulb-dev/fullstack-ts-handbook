# main 分支验证：比 PR 门禁更重——覆盖率 + 生产构建上的 E2E，失败上传诊断产物。
name: Main

on:
  push:
    branches: [main]

# main 不取消旧 run：每次合并都要有完整验证记录
concurrency:
  group: main-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build

      # 诊断产物：测试报告（artifacts 与 cache 的区别见第 8 章）
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            **/test-results/
            **/coverage/
          retention-days: 7
          if-no-files-found: ignore

  e2e:
    runs-on: ubuntu-latest
    needs: integration
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # E2E 跑在生产构建上：先 build
      - run: pnpm build

      # 安装浏览器与系统依赖（CI 全新 runner，无本机缓存）
      - name: Install Playwright browsers
        run: pnpm --filter @workboard/e2e exec playwright install --with-deps chromium

      - name: Run E2E
        run: pnpm e2e
        env:
          CI: "true"

      # 失败时上传 trace 与报告——排障的关键证据（不含秘密，第 7、8 章）
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7
          if-no-files-found: ignore
