# Workboard Web：静态文件 + /api 反向代理
# 与 apps/web/vite.config.ts 的 dev proxy 一一对应：
# 开发期 Vite 代理 /api -> localhost:3000；生产期 nginx 代理 /api -> api:3000。
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API 反向代理：容器网络里 api 是 Compose 服务名（第 7、10 章）
    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA  fallback：前端路由的路径都回到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源长缓存（Vite 产物文件名带 hash）
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}